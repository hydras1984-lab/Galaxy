<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Карта 200x200</title>
<link rel="stylesheet" href="map.css">
</head>
<body>

<h3 class="title">Карта 200x200</h3>

<div class="controls">
  <button id="toggleSectors">Показать/скрыть границы</button>
  <button id="toggleStart">Показать/скрыть стартовые планеты</button>
</div>

<div class="controls">
  <select id="sectorSelect">
    <option value="1">Сектор 1 (нижний левый)</option>
    <option value="2">Сектор 2 (нижний правый)</option>
    <option value="3">Сектор 3 (верхний левый)</option>
    <option value="4">Сектор 4 (верхний правый)</option>
  </select>
  <button id="startGame">Начать игру</button>
</div>

<canvas id="map" width="800" height="800"></canvas>

<div id="info">Координаты: —</div>

<div id="menu">
  <div id="menu-coords">Клетка: —</div>
  <div>Действие 1</div>
  <div>Действие 2</div>
  <div>Действие 3</div>
</div>

<script src="map.js"></script>
</body>
</html>
