<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Галактическая карта</title>
<style>
  body {
    margin: 0;
    height: 100vh;
    overflow: hidden;
    font-family: Arial, sans-serif;
    color: #eee;

    /* Реалистичная туманность */
    background: url('assets/nebula.jpg') no-repeat center center fixed;
    background-size: cover;
  }

  /* Затемняющий слой */
  .overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(5, 5, 20, 0.55);
    backdrop-filter: blur(1px);
    z-index: 0;
  }

  header {
    position: relative;
    z-index: 1;
    padding: 40px 20px;
    text-align: center;
    font-size: 36px;
    font-weight: bold;
    letter-spacing: 1px;
    text-shadow: 0 0 18px rgba(255,0,180,0.8);
  }

  .center {
    position: relative;
    z-index: 1;
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  /* Светящиеся кнопки */
  .btn {
    padding: 14px 28px;
    margin: 10px;
    font-size: 20px;
    background: rgba(20,20,30,0.8);
    border: 1px solid rgba(255,0,180,0.5);
    color: #fff;
    cursor: pointer;
    border-radius: 6px;
    transition: 0.25s;
    box-shadow: 0 0 12px rgba(255,0,180,0.4);
  }

  .btn:hover {
    background: rgba(60,20,60,0.9);
    box-shadow: 0 0 18px rgba(255,0,200,0.8);
    transform: translateY(-2px);
  }

  footer {
    position: relative;
    z-index: 1;
    text-align: center;
    padding: 15px;
    font-size: 14px;
    opacity: 0.7;
  }
</style>
</head>
<body>

<div class="overlay"></div>

<header>Галактическая карта</header>

<div class="center">
  <button class="btn" onclick="location.href='map/index.html'">Открыть карту</button>
  <button class="btn" onclick="location.href='docs/index.html'">Документация</button>
</div>

<footer>© Халяпин, 2026</footer>

</body>
</html>
