<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Галактическая карта</title>
<style>
  body {
    margin: 0;
    background: #0d0d0d;
    color: #eee;
    font-family: Arial, sans-serif;
    display: flex;
    flex-direction: column;
    height: 100vh;
  }
  header {
    padding: 40px 20px;
    text-align: center;
    font-size: 36px;
    font-weight: bold;
    letter-spacing: 1px;
  }
  .center {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  .btn {
    padding: 14px 28px;
    margin: 10px;
    font-size: 20px;
    background: #222;
    border: 1px solid #555;
    color: #fff;
    cursor: pointer;
    border-radius: 6px;
    transition: 0.2s;
  }
  .btn:hover {
    background: #333;
  }
  footer {
    text-align: center;
    padding: 15px;
    font-size: 14px;
    opacity: 0.6;
  }
</style>
</head>
<body>

<header>Галактическая карта</header>

<div class="center">
  <button class="btn" onclick="location.href='map/index.html'">Открыть карту</button>
  <button class="btn" onclick="location.href='docs/index.html'">Документация</button>
</div>

<footer>© Халяпин, 2026</footer>

</body>
</html>
