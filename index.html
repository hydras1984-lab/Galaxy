<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Галактическая карта</title>
<style>
  body {
    margin: 0;
    height: 100vh;
    overflow: hidden;
    font-family: Arial, sans-serif;
    color: #eee;

    /* Реалистичная туманность */
    background: url('assets/nebula.jpg') no-repeat center center fixed;
    background-size: cover;
  }

  /* Затемняющий слой */
  .overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(5, 5, 20, 0.55);
    backdrop-filter: blur(1px);
    z-index: 0;
  }

  header {
    position: relative;
    z-index: 1;
    padding: 40px 20px;
    text-align: center;
    font-size: 36px;
    font-weight: bold;
    letter-spacing: 1px;
    text-shadow: 0 0 18px rgba(255,0,180,0.8);
  }

  .center {
    position: relative;
    z-index: 1;
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  /* Светящиеся кнопки */
  .btn {
    padding: 14px 32px;
    margin: 12px;
    font-size: 22px;
    background: rgba(10, 10, 20, 0.65);
    border: 2px solid rgba(255, 0, 180, 0.55);
    color: #fff;
    cursor: pointer;
    border-radius: 8px;
    transition: 0.25s;
    box-shadow:
        0 0 12px rgba(255, 0, 180, 0.35),
        inset 0 0 12px rgba(255, 0, 180, 0.25);
    letter-spacing: 0.5px;
    backdrop-filter: blur(2px);
  }

  /* Ховер — энергетический импульс */
  .btn:hover {
    background: rgba(40, 10, 60, 0.85);
    border-color: rgba(255, 80, 200, 0.9);
    box-shadow:
        0 0 18px rgba(255, 80, 200, 0.9),
        inset 0 0 18px rgba(255, 80, 200, 0.6);
    transform: translateY(-3px) scale(1.03);
  }

  /* Нажатие — лёгкая отдача */
  .btn:active {
    transform: translateY(0px) scale(0.98);
    box-shadow:
        0 0 10px rgba(255, 0, 150, 0.5),
        inset 0 0 10px rgba(255, 0, 150, 0.4);
  }

  footer {
    position: relative;
    z-index: 1;
    text-align: center;
    padding: 15px;
    font-size: 14px;
    opacity: 0.7;
  }
</style>
</head>
<body>

<div class="overlay"></div>

<header>Галактическая карта</header>

<div class="center">
  <button class="btn" onclick="location.href='map/index.html'">Открыть карту</button>
  <button class="btn" onclick="location.href='docs/index.html'">Документация</button>
</div>

<footer>© Hydras, 2026</footer>

</body>
</html>
